[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scoresight"
version = "0.2.0.dev0"
description = "Real-time scoreboard OCR service and web operator interface"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
ocr = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<6",
  "pillow>=10,<13",
  "tesserocr>=2.7,<3",
]
desktop-legacy = ["pyside6>=6.7,<7", "opencv-python>=4.10,<6"]
dev = [
  "mypy>=1.13,<2",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<6",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
scoresight-service = "scoresight.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["scoresight*"]

[tool.setuptools.package-data]
scoresight = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = ["decklink_hardware: requires a physical DeckLink device and vendor runtime"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["src/ui_*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["scoresight"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["scoresight"]
branch = true
