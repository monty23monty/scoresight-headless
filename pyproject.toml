[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scoresight"
version = "0.2.0.dev0"
description = "Real-time scoreboard OCR service and web operator interface"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "prometheus-client>=0.21,<1",
  "pyjwt[crypto]>=2.10,<3",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=15,<18",
]

[project.optional-dependencies]
ocr = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<6",
  "pillow>=10,<13",
  "tesserocr>=2.7,<3; sys_platform != 'win32'",
  "tesserocr @ https://github.com/simonflueckiger/tesserocr-windows_build/releases/download/tesserocr-v2.10.0-tesseract-5.5.2/tesserocr-2.10.0-cp311-cp311-win_amd64.whl#sha256=02f75202a13804dacaac111cc4375cdb7b0194217f7f36add30cbb57c37c002c ; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.11'",
  "tesserocr @ https://github.com/simonflueckiger/tesserocr-windows_build/releases/download/tesserocr-v2.10.0-tesseract-5.5.2/tesserocr-2.10.0-cp312-cp312-win_amd64.whl#sha256=e05d41a2b0e6f38f3a5195d05a73674d72152a775d1b8ebe481ca9306f94d27a ; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.12'",
  "tesserocr @ https://github.com/simonflueckiger/tesserocr-windows_build/releases/download/tesserocr-v2.10.0-tesseract-5.5.2/tesserocr-2.10.0-cp313-cp313-win_amd64.whl#sha256=a7f1a56f2c70095d108304e2e76fd6aebd06a42712cb87b8976d52d1e7faf6d8 ; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.13'",
  "tesserocr @ https://github.com/simonflueckiger/tesserocr-windows_build/releases/download/tesserocr-v2.10.0-tesseract-5.5.2/tesserocr-2.10.0-cp314-cp314-win_amd64.whl#sha256=e7abf40539b852bd25cceadad7a1a3bba9c223556bafa908e2dbf91407080af5 ; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
]
desktop-legacy = ["pyside6>=6.7,<7", "opencv-python>=4.10,<6"]
dev = [
  "black==26.5.1",
  "mypy>=1.13,<2",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<6",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
scoresight-service = "scoresight.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["scoresight*"]

[tool.setuptools.package-data]
scoresight = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = ["decklink_hardware: requires a physical DeckLink device and vendor runtime"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["src/ui_*.py"]

[tool.black]
target-version = ["py311"]
exclude = "/ui_.*\\.py"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["scoresight"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["scoresight"]
branch = true
