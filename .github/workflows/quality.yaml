name: Service quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install uv
      - run: uv sync --locked --extra dev --python python
      - run: uv run ruff check src/scoresight tests scripts/benchmark_ocr.py
      - run: uv run mypy -p scoresight
      - run: uv run pytest -m "not decklink_hardware" --cov=scoresight --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: service-coverage
          path: coverage.xml

  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv build --locked
      - uses: actions/upload-artifact@v4
        with:
          name: service-package
          path: dist/*
