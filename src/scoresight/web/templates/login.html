<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ScoreSight sign in</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body class="login-page">
    <main class="login-card">
      <p class="eyebrow">ScoreSight</p>
      <h1>Operator sign in</h1>
      <p>Enter the administrator token from the service configuration.</p>
      {% if error %}<p class="error" role="alert">The token was not accepted.</p>{% endif %}
      <form method="post" action="/login">
        <label for="token">Administrator token</label>
        <input id="token" name="token" type="password" required autofocus autocomplete="current-password">
        <button type="submit">Open control room</button>
      </form>
    </main>
  </body>
</html>
